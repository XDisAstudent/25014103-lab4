<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Catalogue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        table { border-collapse: collapse; width: 100%; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #4CAF50; color: white; }
        tr:nth-child(even) { background: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Book Catalogue</h1>
    <div id="output">Loading...</div>
    <script>
        fetch('book.xml')
            .then(response => {
                if (!response.ok) throw new Error('Fetch error: ' + response.status);
                return response.text();
            })
            .then(xmlText => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                const books = xmlDoc.getElementsByTagName('book');
                let html = '<table><tr><th>ID</th><th>Title</th><th>Author</th><th>Price</th></tr>';
                for (let i = 0; i < books.length; i++) {
                    html += `<tr>
                        <td>${books[i].getAttribute('id')}</td>
                        <td>${books[i].getElementsByTagName('title')[0].textContent}</td>
                        <td>${books[i].getElementsByTagName('author')[0].textContent}</td>
                        <td>$${books[i].getElementsByTagName('price')[0].textContent}</td>
                    </tr>`;
                }
                document.getElementById('output').innerHTML = html + '</table>';
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
